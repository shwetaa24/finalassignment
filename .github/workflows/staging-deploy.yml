name: Staging Deploy

# Run only when code is pushed to staging branch
on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Build Maven project
      - name: Build Maven project
        run: |
          cd finalassignment        # Change to your Maven project folder
          mvn clean package

      # Step 3: Setup SSH for deployment
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.STAGING_KEY }}

      # Step 4: Deploy files to staging server
      - name: Deploy to staging server
        run: |
          rsync -avz --delete finalassignment/target/ ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/var/www/myapp/

      # Step 5: Notify Slack
      - name: Notify Slack
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ Staging deployment successful!"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
