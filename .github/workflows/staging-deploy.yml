name: Staging Deploy

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Build with Maven (example, adjust if using npm, gradle, etc.)
      - name: Build project
        run: mvn clean install -DskipTests

      # Deploy to staging server
      - name: Deploy to staging server
        run: |
          rsync -avz --delete \
          -e "ssh -o StrictHostKeyChecking=no" \
          ./target/ ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/var/www/staging-app/

      # Notify Slack
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_TITLE: "✅ Staging Deployment Successful"
          SLACK_MESSAGE: "Code has been deployed to staging."
