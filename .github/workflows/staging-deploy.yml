name: Staging Deploy

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Build application (example for Java/Maven)
    - name: Build with Maven
      run: mvn clean package -Denv=staging
      working-directory: ./backend  # change to your project folder



    # 3. Deploy to staging server via SCP
    - name: Deploy to staging
      uses: appleboy/scp-action@v0.1.1
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        port: 22
        source: "backend/target/*.jar"   # adjust path
        target: "/home/username/app/"    # staging server path

    # 4. Restart service (optional)
    - name: Restart service
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        port: 22
        script: |
          sudo systemctl restart my-app.service

    # 5. Send Slack notification
    - name: Notify Slack
      uses: rtCamp/action-slack-notify@v2
      with:
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        message: "✅ Staging deployment successful for commit ${{ github.sha }}"
        status: custom