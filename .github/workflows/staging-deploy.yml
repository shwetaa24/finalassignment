name: Staging Deploy

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Maven project
        run: |
          mvn clean package

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_KEY }}

      - name: Deploy to staging server
        run: |
          rsync -avz --delete target/ ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/var/www/myapp/

      - name: Notify Slack
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ Staging deployment successful!"}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"
